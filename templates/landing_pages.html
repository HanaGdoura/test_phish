{% extends "base.html" %}

{% block content %}
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <h2 class="h5 mb-3">Create Landing Page</h2>
    <form method="post" action="{{ url_for('landing_pages') }}">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" name="name" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Description</label>
          <input type="text" class="form-control" name="description" placeholder="Describe this landing page">
        </div>
        <div class="col-12">
          <label class="form-label">HTML / Form Content</label>
          <textarea class="form-control" name="content" rows="10"><div class="container py-5"><div class="card shadow-sm"><div class="card-body"><h2 class="h4">Security Verification</h2><p>Please confirm your identity to continue.</p><form method="post" action="/submit/{{ tracking_id }}"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" name="password" type="password" required></div><button class="btn btn-primary">Submit</button></form></div></div></div></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary">Save Landing Page</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <h2 class="h5 mb-3">Landing Pages</h2>
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Path</th>
        </tr>
      </thead>
      <tbody>
        {% for page in landing_pages %}
        <tr>
          <td>{{ page[1] }}</td>
          <td>{{ page[2] }}</td>
          <td>{{ page[3] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
