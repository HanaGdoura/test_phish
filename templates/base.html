<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phishook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">Phishook</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="nav-link" href="{{ url_for('landing_pages') }}">Landing Pages</a>
          <a class="nav-link" href="{{ url_for('groups') }}">Groups</a>
          <a class="nav-link" href="{{ url_for('campaigns') }}">Campaigns</a>
          <a class="nav-link" href="{{ url_for('simulator_dashboard') }}">Simulator</a>
          <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
